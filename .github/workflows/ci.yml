name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env: { CGO_ENABLED: "0", GOWORK: "off" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27.1" }
      - run: go vet ./...
      - run: go test -covermode=set -coverprofile=cover.out ./...
      - name: Enforce 100% coverage
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 < 100.0) ? 1 : 0 }' || { go tool cover -func=cover.out | grep -v '100.0%'; exit 1; }
  cross-build:
    runs-on: ubuntu-latest
    env: { CGO_ENABLED: "0", GOWORK: "off" }
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27.1" }
      - env: { GOOS: "${{ matrix.target.goos }}", GOARCH: "${{ matrix.target.goarch }}" }
        run: go build ./...
